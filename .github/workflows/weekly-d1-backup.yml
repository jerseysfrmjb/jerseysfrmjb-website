name: Weekly D1 backup

on:
  schedule:
    - cron: "15 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export D1 and inventory
        run: node scripts/export-d1-backup.mjs backups
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Store encrypted workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jerseysfrmjb-weekly-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
